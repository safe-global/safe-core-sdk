name: API Kit - E2E Tests
on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        safe-version: [v1.3.0, v1.4.1, v1.5.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test ethers - Safe ${{ matrix.safe-version }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cd packages/api-kit
          pnpm test:ci:ethers:${{ matrix.safe-version }}
      - name: Test viem - Safe ${{ matrix.safe-version }}
        if: ${{ !cancelled() }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cd packages/api-kit
          pnpm test:ci:viem:${{ matrix.safe-version }}
